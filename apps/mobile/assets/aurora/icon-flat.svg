<?xml version="1.0" encoding="UTF-8"?>
<!--
  Composite iOS icon — gradient bg + lemniscate mark. iOS App Store
  requires a 1024×1024 flat PNG (no transparency). Android uses the
  adaptive form (separate fg/bg) instead.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bgPrimary" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0E2E"/>
      <stop offset="0.5" stop-color="#2A1652"/>
      <stop offset="1" stop-color="#0E2336"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="22%" cy="20%" r="80%">
      <stop offset="0" stop-color="#FF8E72" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#B89AF5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0A0B1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8E72"/>
      <stop offset="0.45" stop-color="#E5B07F"/>
      <stop offset="0.75" stop-color="#B89AF5"/>
      <stop offset="1" stop-color="#5DDDD5"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bgPrimary)"/>
  <rect width="1024" height="1024" fill="url(#bgGlow)"/>

  <path
    d="
      M 512 512
      C 720 312, 856 348, 856 512
      C 856 676, 720 696, 512 512
      C 304 312, 168 348, 168 512
      C 168 676, 304 696, 512 512
      Z
    "
    fill="none"
    stroke="url(#mark)"
    stroke-width="80"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <circle cx="512" cy="512" r="22" fill="#FFF4ED"/>
</svg>
