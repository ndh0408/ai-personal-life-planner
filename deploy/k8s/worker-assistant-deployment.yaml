apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeos-worker-assistant
  namespace: lifeos
  labels: { app: lifeos, tier: worker, role: assistant }
spec:
  replicas: 1
  selector:
    matchLabels: { app: lifeos, tier: worker, role: assistant }
  template:
    metadata:
      labels: { app: lifeos, tier: worker, role: assistant }
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/lifeos-api:CHANGE_ME
          envFrom:
            - configMapRef: { name: lifeos-api-config }
            - secretRef: { name: lifeos-api-secrets }
          env:
            - name: PORT
              value: "3004"
            - name: METRICS_ENABLED
              value: "false"
            - name: WORKER_ROLE
              value: "assistant"
          resources:
            requests: { cpu: "100m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
      terminationGracePeriodSeconds: 60
