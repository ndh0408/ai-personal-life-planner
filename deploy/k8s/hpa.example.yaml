# HPA for the API tier. Add separate HPAs per worker deployment if their
# CPU profile diverges (notification spikes vs steady AI calls).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lifeos-api
  namespace: lifeos
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lifeos-api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 75 }
