# Reference (NOT production-ready). Replace every base64 value below before
# applying. Better yet: rotate all of them via your secret manager (External
# Secrets Operator, Vault, AWS Secrets Manager) and stop committing this
# file once your secret pipeline is wired.
#
# Generate a fresh value:
#   openssl rand -base64 48 | tr -d '\n' | base64
apiVersion: v1
kind: Secret
metadata:
  name: lifeos-api-secrets
  namespace: lifeos
type: Opaque
stringData:
  DATABASE_URL: "postgresql://lifeos:CHANGE_ME@postgres.lifeos:5432/lifeos?schema=public&connection_limit=10"
  REDIS_URL: "redis://redis.lifeos:6379"
  JWT_ACCESS_SECRET: "CHANGE_ME_48_BYTES_BASE64"
  JWT_REFRESH_SECRET: "CHANGE_ME_DIFFERENT_48_BYTES_BASE64"
  AI_PROVIDER_ENCRYPTION_KEY: "CHANGE_ME_64_HEX_CHARS"
  AI_API_KEY: "CHANGE_ME"
  CORS_ORIGIN: "https://app.example.com"
  APP_PUBLIC_URL: "https://app.example.com"
  METRICS_BEARER_TOKEN: "CHANGE_ME_LONG_RANDOM"
  SMTP_HOST: "smtp.example.com"
  SMTP_USER: "CHANGE_ME"
  SMTP_PASS: "CHANGE_ME"
  SMTP_FROM: "LifeOS AI <noreply@example.com>"
  BACKUP_ENCRYPTION_KEY: "CHANGE_ME_64_HEX_CHARS"
