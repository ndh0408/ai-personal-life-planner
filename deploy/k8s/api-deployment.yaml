# Reference manifest for the API tier. Splits HTTP-serving from worker
# containers (see worker-*.yaml in this directory). 2 replicas + HPA, no
# in-process queue draining (workers handle that).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lifeos-api
  namespace: lifeos
  labels: { app: lifeos, tier: api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: lifeos, tier: api }
  template:
    metadata:
      labels: { app: lifeos, tier: api }
      annotations:
        # Prometheus scrape; gated by METRICS_ENABLED + bearer token.
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/lifeos-api:CHANGE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef: { name: lifeos-api-config }
            - secretRef: { name: lifeos-api-secrets }
          env:
            - name: WORKER_ROLE
              value: "none"   # API pods do not drain queues
          # Round-11: enableShutdownHooks() runs PrismaService.$disconnect on
          # SIGTERM. preStop sleep gives the load-balancer time to deregister.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "1000m", memory: "768Mi" }
      terminationGracePeriodSeconds: 30
