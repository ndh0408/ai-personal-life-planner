# Reference (NOT production-ready) — copy + edit for your cluster.
# Non-secret config only. Real secrets go in `secret.example.yaml`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: lifeos-api-config
  namespace: lifeos
data:
  NODE_ENV: "production"
  PORT: "3000"
  DEFAULT_LOCALE: "vi"
  SUPPORTED_LOCALES: "vi,en"

  # Round 12 — queue + observability
  QUEUE_ENABLED: "true"
  WORKER_CONCURRENCY_NOTIFICATION: "5"
  WORKER_CONCURRENCY_AI: "2"
  WORKER_CONCURRENCY_REPORT: "2"
  METRICS_ENABLED: "true"
  METRICS_PATH: "/metrics"
  LOG_LEVEL: "log"

  # Round 17 — auth-security email
  EMAIL_PROVIDER: "smtp"
  SMTP_PORT: "587"
  SMTP_SECURE: "false"

  # Round 18 — OTel (env hooks; SDK packages installed only when needed)
  OTEL_ENABLED: "false"
  OTEL_SERVICE_NAME: "lifeos-api"
  OTEL_ENVIRONMENT: "production"
