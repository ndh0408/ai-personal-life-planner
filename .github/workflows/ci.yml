name: CI

# Run on every push to master and on pull requests targeting master. We
# split the work into independent jobs so a Prisma typecheck failure
# doesn't block the mobile lint, and a slow Android build doesn't gate
# the API unit tests.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  NODE_VERSION: '20.12'

jobs:
  install:
    name: Install + cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - name: Build @lifeos/shared
        run: npm --workspace @lifeos/shared run build
      - uses: actions/upload-artifact@v4
        with:
          name: shared-dist
          path: packages/shared/dist
          retention-days: 1

  lint-typecheck:
    name: Lint + typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - name: Build shared
        run: npm --workspace @lifeos/shared run build
      - name: Generate Prisma client
        run: npx --workspace @lifeos/api prisma generate
        env:
          # Prisma generate just reads the schema; this URL is never connected
          # to during the generate step.
          DATABASE_URL: postgresql://lifeos:changeme@localhost:5432/lifeos
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Lint (best-effort, eslint configs are workspace-local)
        run: npm run lint
        continue-on-error: true

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - run: npm --workspace @lifeos/shared run build
      - name: Generate Prisma client
        run: npx --workspace @lifeos/api prisma generate
        env:
          DATABASE_URL: postgresql://lifeos:changeme@localhost:5432/lifeos
      - name: Run API jest
        run: npm --workspace @lifeos/api test

  mobile-tests:
    name: Mobile tests
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci --workspaces --include-workspace-root
      - run: npm --workspace @lifeos/shared run build
      - name: Mobile typecheck
        run: npm --workspace @lifeos/mobile run typecheck
      - name: Mobile jest
        run: npm --workspace @lifeos/mobile test
        # `--passWithNoTests` is configured in the mobile package, so this
        # is green even before round 26 lands the first RN component test.

  android-debug-build:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: install
    # Android builds are slow (>10 min cold); skip on PRs to keep iteration
    # tight. Round 26+ moves this to a nightly schedule.
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/android/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/**/gradle-wrapper.properties') }}
      - run: npm ci --workspaces --include-workspace-root
      - run: npm --workspace @lifeos/shared run build
      - name: Assemble debug APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
